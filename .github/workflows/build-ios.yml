name: Build iOS JDK 27

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'scripts/jdk27_ios_patches/**'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout this repo (for local patches)
        uses: actions/checkout@v4
        with:
          path: amethyst

      - name: Checkout AngelAuraMC openjdk-build
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/angelauramc-openjdk-build
          ref: judge/buildjre17-21-25
          path: openjdk-build

      - name: Override 2_ci_build_global.sh with iOS adaption
        run: |
          cp scripts/ci_build_global_ios.sh openjdk-build/2_ci_build_global.sh
          chmod +x openjdk-build/2_ci_build_global.sh
          echo "=== Patched 2_ci_build_global.sh ==="
          head -5 openjdk-build/2_ci_build_global.sh

      - name: Setup boot JDK (Temurin 26)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'

      - name: Install build deps
        run: |
          brew update
          brew install autoconf fontconfig ldid xquartz make wget
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Stage iOS patches for JDK 27
        working-directory: openjdk-build
        run: |
          mkdir -p patches/jre_27/ios
          cp patches/jre_21/ios/1_jdk21u_ios.diff patches/jre_27/ios/
          cp patches/jre_21/ios/2_mirror_mapping.diff patches/jre_27/ios/
          cp ../../amethyst/scripts/jdk27_ios_patches/*.diff patches/jre_27/ios/ 2>/dev/null || true

      - name: Make build scripts executable
        working-directory: openjdk-build
        run: |
          chmod +x 2_ci_build_global.sh
          chmod +x 6_buildjdk.sh
          find . -name "*.sh" -exec chmod +x {} \;

      - name: Static scan JDK 27 source
        working-directory: openjdk-build
        run: |
          git clone --depth 1 --branch jdk-27.0.1+8 \
            https://github.com/openjdk/jdk27u.git jdk27-scan 2>/dev/null || \
          git clone --depth 1 --branch master \
            https://github.com/openjdk/jdk.git jdk27-scan
          echo "=== Scanning for iOS-incompatible patterns ==="
          grep -rn "syscall(" jdk27-scan/src/hotspot/ | grep -v "linux\|bsd" | head -20 || true
          grep -rn "MAP_JIT" jdk27-scan/src/ | head -10 || true
          rm -rf jdk27-scan

      - name: Patch 6_buildjdk.sh with layered fallback
        working-directory: openjdk-build
        run: |
          python3 - "$TARGET_VERSION" << 'PYEOF'
          import sys, re

          target_ver = sys.argv[1]
          with open('6_buildjdk.sh', 'r') as f:
              s = f.read()

          # 1.git apply加上--reject
          old_apply = 'git apply {} ||'
          new_apply = 'git apply --reject --whitespace=fix {} || echo "git apply had rejects (fuzz-fallback will handle)"'
          if old_apply in s:
              s = s.replace(old_apply, new_apply)
              print("OK: git apply --reject added")
          else:
              print("WARN: git apply line not found, skipping")

          # 2.在iOS xargs行之后插入fuzz-fallback
          xargs_line_re = re.compile(
              r"^([ \t]*)find \.\./patches/jre[^\n]*ios[^\n]*\.diff[^\n]*xargs[^\n]*$",
              re.MULTILINE
          )
          matches = list(xargs_line_re.finditer(s))
          if matches:
              m = matches[0]
              indent = m.group(1)
              fuzz_block = (
                  f"\n"
                  f"{indent}# Fuzz-fallback: GNU patch -F 100 on .rej files\n"
                  f"{indent}for r in $(find openjdk-{target_ver} -name '*.rej' 2>/dev/null); do\n"
                  f"{indent}  target=$(echo \"$r\" | sed 's/\\.rej$//')\n"
                  f"{indent}  echo \"  [fuzz] retrying $r -> $target\"\n"
                  f"{indent}  mv \"$r\" \"$r.bak\"\n"
                  f"{indent}  patch -F 100 --ignore-whitespace \"$target\" < \"$r.bak\" || true\n"
                  f"{indent}  mv \"$r.bak\" \"$r\"\n"
                  f"{indent}done\n"
              )
              s = s[:m.end()] + fuzz_block + s[m.end():]
              print("OK: fuzz-fallback block inserted")
          else:
              print("WARN: iOS xargs line not found, fuzz-fallback skipped")

          # 3.make -k继续编译
          old_make = 'make JOBS=$jobs images || \\'
          new_make = 'make JOBS=$jobs -k images || \\'
          if old_make in s:
              s = s.replace(old_make, new_make)
              print("OK: make -k added")
          else:
              print("WARN: make line not found for -k flag")

          with open('6_buildjdk.sh', 'w') as f:
              f.write(s)
          print("DONE: 6_buildjdk.sh patched")
          PYEOF

      - name: Build iOS JDK 27
        working-directory: openjdk-build
        env:
          BUILD_IOS: '1'
          TARGET_VERSION: '27'
          MIN_IOS: '15.0'
        shell: bash
        run: |
          set -o pipefail
          bash 2_ci_build_global.sh 2>&1 | tee build.log

      - name: Show last 200 lines of build log
        if: always()
        working-directory: openjdk-build
        run: tail -200 build.log 2>/dev/null || true

      - name: Summarize rejected patches
        if: always()
        working-directory: openjdk-build
        run: |
          REJ_COUNT=$(find openjdk-27 -name "*.rej" 2>/dev/null | wc -l | tr -d ' ')
          echo "=== rejected hunks: $REJ_COUNT files ==="
          find openjdk-27 -name "*.rej" 2>/dev/null | sort | head -50 | while read f; do
            HUNK_COUNT=$(grep -c '^@@' "$f" 2>/dev/null || echo 0)
            echo "  $f ($HUNK_COUNT hunks)"
          done

      - name: Find built JRE
        if: always()
        working-directory: openjdk-build
        run: |
          find . -name "libjvm.dylib" -type f 2>/dev/null | head -5
          find . -name "*.tar.xz" -type f 2>/dev/null | head -5

      - name: Upload built JRE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jre27-ios-aarch64
          path: openjdk-build/*.tar.xz

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-jdk27
          path: openjdk-build/build.log

      - name: Upload rejected patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-patches-jdk27
          path: openjdk-build/openjdk-27/**/*.rej

      - name: Upload patched source tree (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jdk27-patched-tree
          path: |
            openjdk-build/openjdk-27/src/hotspot/share/code/**
            openjdk-build/openjdk-27/src/hotspot/cpu/aarch64/**
            openjdk-build/openjdk-27/src/hotspot/os/bsd/**
            openjdk-build/openjdk-27/src/hotspot/share/runtime/atomic.hpp
            openjdk-build/openjdk-27/src/hotspot/share/runtime/deoptimization.cpp
            openjdk-build/openjdk-27/src/hotspot/share/gc/shared/gc_globals.hpp
